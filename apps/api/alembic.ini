# Alembic configuration for managing AegisCore database migrations.
[alembic]
# Location of migration environment and version files.
script_location = alembic
prepend_sys_path = .
# Default development database URL used by Alembic.
sqlalchemy.url = postgresql+psycopg://aegiscore:aegiscore_dev_password@postgres:5432/aegiscore

# Logging settings used when running migration commands.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

