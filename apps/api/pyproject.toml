# Build configuration for packaging the FastAPI backend.
[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

# Project metadata and runtime dependencies for the API container.
[project]
name = "aegiscore-api"
version = "0.1.0"
description = "AegisCore FastAPI backend"
requires-python = ">=3.12"
# Backend dependencies used for the API, database, authentication, and AI scoring.
dependencies = [
  "fastapi>=0.116.0,<0.117.0",
  "uvicorn[standard]>=0.35.0,<0.36.0",
  "sqlalchemy>=2.0.41,<3.0.0",
  "alembic>=1.16.0,<2.0.0",
  "psycopg[binary]>=3.2.9,<4.0.0",
  "PyJWT>=2.10.1,<3.0.0",
  "pyotp>=2.9.0,<3.0.0",
  "passlib>=1.7.4,<2.0.0",
  "pydantic>=2.11.7,<3.0.0",
  "pydantic-settings>=2.10.1,<3.0.0",
  "numpy>=1.26.0,<2.2.0",
  "pandas>=2.2.0,<3.0.0",
  "tensorflow-cpu>=2.17.0,<2.20.0"
]

# Development-only tools used for testing and linting.
[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<0.29.0",
  "pytest>=8.4.1,<9.0.0",
  "ruff>=0.12.4,<0.13.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

# Pytest configuration for API tests.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Ruff formatting/linting preferences for the backend code.
[tool.ruff]
line-length = 100
target-version = "py312"
